[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-1"
version = "0.1.0"
description = "Local compounding engineering pipeline CLI"
requires-python = ">=3.11"
dependencies = [
  "dspy-ai>=3.0.0",
  "tomli-w>=1.0.0",
]

[project.scripts]
bd-1 = "bd1.cli:main"
bd1-pi-history-loader = "bd1.history_loader:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
